plugins { id 'com.android.application' }

android {
    namespace 'ir.scooljavanrood.madreseyar.teacher'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.scooljavanrood.madreseyar.teacher'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-github-biometric-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// FileProvider for camera output without world-readable file:// URIs.
dependencies {
    // FIX03: Kotlin 1.8+ merged jdk7/jdk8 classes into kotlin-stdlib.
    // Some AndroidX transitive dependencies request the old 1.6.21 jdk variants.
    // Use the official Kotlin BOM so stdlib, stdlib-jdk7 and stdlib-jdk8 align.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
